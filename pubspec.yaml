name: guardianes_chacra
description: "Tower defense andino: guardianes que defienden la cosecha de la collca."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flame: ^1.38.2
  # Dibuja los mapas de Tiled. Fija `tiled` en ^0.11 (aunque ya existe la 0.12).
  flame_audio: ^2.12.2
  flame_tiled: ^3.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Anuncios de AdMob y el formulario de consentimiento de Google (UMP),
  # detrás de AdsService (Fase 10).
  google_mobile_ads: ^9.1.0
  # La versión de intl la fija flutter_localizations; "any" evita conflictos.
  intl: any
  # @immutable y otras anotaciones en Dart puro (sirve dentro de domain/).
  meta: ^1.19.0
  # La interfaz animada hecha en Rive (trae rive_native: librerías nativas
  # que se descargan al compilar). Ver docs/UI_RIVE.md.
  rive: ^0.14.11
  # Progreso y ajustes como un documento JSON versionado (Fase 7).
  shared_preferences: ^2.5.6
  # Lee los mapas de Tiled en Dart puro (la capa data los convierte en
  # caminos y espacios). La fija flame_tiled: no subir a 0.12 por separado.
  tiled: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Genera AppLocalizations a partir de los ARB (configuración en l10n.yaml).
  generate: true

  # Flutter no incluye subcarpetas solas: cada carpeta de contenido se
  # declara aquí. Un guardián, plaga o nivel nuevo no necesita tocar esta
  # lista (solo su archivo y su id en assets/content/index.json).
  assets:
    - assets/content/
    - assets/content/guardians/
    - assets/content/pests/
    - assets/content/levels/
    - assets/content/i18n/
    # Mapas de Tiled y su tileset (flame_tiled los busca en assets/tiles/).
    - assets/tiles/
    # Música y efectos (flame_audio los busca en assets/audio/). Una carpeta
    # nueva dentro de assets/audio/ hay que agregarla aquí.
    - assets/audio/music/
    - assets/audio/sfx/
    # Sprites de plagas y guardianes (Flame los busca en assets/images/). Al
    # agregar la primera imagen de guardianes, sumar assets/images/guardians/.
    - assets/images/pests/
    # La interfaz hecha en Rive: un solo archivo (ver docs/UI_RIVE.md).
    - assets/rive/
    # Licencias de las fuentes (la OFL pide distribuirlas con la fuente;
    # main.dart las agrega a la pantalla de licencias).
    - assets/fonts/LilitaOne-OFL.txt
    - assets/fonts/Fredoka-OFL.txt

  # Las mismas fuentes que la interfaz de Rive (ver AppTheme). Fredoka es
  # variable: FontWeight elige el peso (300–700) sin más configuración.
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
